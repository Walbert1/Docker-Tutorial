<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2310b981'/><path d='M9 16l5 5 9-10' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <style>
    :root {
      --bg: #0b0f14;
      --card: #121821;
      --item: #161d27;
      --border: #222c38;
      --text: #e6edf3;
      --muted: #8b98a5;
      --accent: #10b981;
      --accent-soft: rgba(16,185,129,0.14);
      --danger: #f05252;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa; --card: #ffffff; --item: #f6f8fa; --border: #d8dee4;
        --text: #1f2328; --muted: #59636e; --accent: #059669;
        --accent-soft: rgba(5,150,105,0.1); --danger: #d1242f;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 56px 16px 32px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }

    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; }
    .date { font-family: var(--mono); font-size: 12px; color: var(--muted); }

    form { margin-top: 20px; display: flex; gap: 8px; }
    input[type=text] {
      flex: 1; min-width: 0;
      padding: 12px 14px;
      font: inherit; font-size: 15px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }
    input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    button { font: inherit; cursor: pointer; }
    .add {
      padding: 0 18px;
      border: 0; border-radius: 10px;
      background: var(--accent); color: #fff;
      font-weight: 600;
    }
    .add:hover { filter: brightness(1.1); }

    .bar {
      margin-top: 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      font-size: 13px; color: var(--muted);
    }
    ul { list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    li {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 12px 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      animation: in .18s ease-out;
    }
    @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { li { animation: none; } }

    .check {
      flex: 0 0 22px; height: 22px;
      display: grid; place-items: center;
      border: 2px solid var(--border); border-radius: 6px;
      background: none; color: #fff;
    }
    .check svg { width: 13px; height: 13px; opacity: 0; }
    li.done .check { background: var(--accent); border-color: var(--accent); }
    li.done .check svg { opacity: 1; }

    .text { flex: 1; min-width: 0; word-break: break-word; font-size: 15px; }
    li.done .text { color: var(--muted); text-decoration: line-through; }
    .edit {
      flex: 1; min-width: 0; padding: 4px 8px;
      font: inherit; font-size: 15px; color: var(--text);
      background: var(--item); border: 1px solid var(--accent); border-radius: 6px; outline: none;
    }

    .del {
      flex: 0 0 auto; width: 28px; height: 28px;
      display: grid; place-items: center;
      border: 0; border-radius: 6px;
      background: none; color: var(--muted);
      opacity: 0; transition: opacity .15s;
    }
    li:hover .del, .del:focus-visible { opacity: 1; }
    @media (hover: none) { .del { opacity: 1; } }
    .del:hover { color: var(--danger); background: rgba(240,82,82,0.1); }
    .del svg { width: 16px; height: 16px; }

    .empty {
      margin-top: 10px; padding: 36px 16px;
      text-align: center; color: var(--muted); font-size: 14px;
      border: 1px dashed var(--border); border-radius: 10px;
    }
    .api-status { margin-top: 12px; color: var(--muted); font-size: 13px; }
    .api-status.error { color: var(--danger); }
    .hint { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>To-Do</h1>
      <span class="date" id="date"></span>
    </header>
    <form id="form" autocomplete="off">
      <input type="text" id="input" placeholder="What needs to be done?" maxlength="200" aria-label="New task" autofocus>
      <button class="add" type="submit">Add</button>
    </form>

    <div class="bar">
      <span id="count">0 tasks</span>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>Nothing here. Add a task above.</div>
    <p class="api-status" id="api-status" role="status" aria-live="polite"></p>

    <p class="hint">Tasks are loaded from the To-Do API.</p>
  </div>

  <script>
    (function () {
      var API_URL = "http://localhost:8000/api/todos";
      var items = [];

      var $ = function (id) { return document.getElementById(id); };
      var list = $("list"), input = $("input");

      $("date").textContent = new Date().toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });

      var trashSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';

      function setStatus(message, isError) {
        var status = $("api-status");
        status.textContent = message;
        status.classList.toggle("error", Boolean(isError));
        status.setAttribute("role", isError ? "alert" : "status");
      }

      async function readError(response) {
        var body = await response.text();
        if (body) {
          try {
            var parsed = JSON.parse(body);
            if (parsed.detail) return parsed.detail;
          } catch (e) {}
          return body;
        }
        return response.statusText || "Request failed";
      }

      function render() {
        list.innerHTML = "";
        items.forEach(function (t) {
          var li = document.createElement("li");
          li.dataset.id = t.id;

          var txt = document.createElement("span");
          txt.className = "text";
          txt.textContent = t.name;

          var del = document.createElement("button");
          del.className = "del";
          del.setAttribute("aria-label", "Delete " + t.name);
          del.innerHTML = trashSvg;

          li.append(txt, del);
          list.appendChild(li);
        });

        $("count").textContent = items.length + (items.length === 1 ? " task" : " tasks");
        $("empty").hidden = items.length > 0;
      }

      async function refreshTodos() {
        setStatus("Loading tasks...");
        try {
          var response = await fetch(API_URL);
          if (!response.ok) throw new Error(await readError(response));
          items = await response.json();
          render();
          setStatus("");
        } catch (error) {
          setStatus("Could not load tasks: " + error.message, true);
        }
      }

      $("form").addEventListener("submit", async function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) return;
        var addButton = $("form").querySelector("button[type=submit]");
        addButton.disabled = true;
        try {
          var response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: text })
          });
          if (!response.ok) throw new Error(await readError(response));
          items.unshift(await response.json());
          render();
          input.value = "";
          await refreshTodos();
        } catch (error) {
          setStatus("Could not add task: " + error.message, true);
        } finally {
          addButton.disabled = false;
        }
      });

      list.addEventListener("click", async function (e) {
        var button = e.target.closest(".del");
        if (!button) return;
        var li = button.closest("li");
        if (!li) return;
        button.disabled = true;
        try {
          var response = await fetch(API_URL + "/" + encodeURIComponent(li.dataset.id), { method: "DELETE" });
          if (!response.ok) throw new Error(await readError(response));
          items = items.filter(function (item) { return String(item.id) !== li.dataset.id; });
          render();
          await refreshTodos();
        } catch (error) {
          setStatus("Could not delete task: " + error.message, true);
        } finally {
          button.disabled = false;
        }
      });

      refreshTodos();
    })();
  </script>
</body>
</html>
